<!doctype html>
<html><head><meta charset="utf-8"><title>CinergyPro Program</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}canvas{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%}</style>
</head><body><canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
function fit() { const k = Math.min(innerWidth / c.width, innerHeight / c.height); c.style.width = c.width * k + 'px'; c.style.height = c.height * k + 'px'; }
window.native.on('popout:message', async (m) => {
  if (m.type !== 'frame') return;
  const bmp = await createImageBitmap(new Blob([m.data], { type: 'image/jpeg' }));
  if (c.width !== m.w || c.height !== m.h) { c.width = m.w; c.height = m.h; fit(); }
  ctx.drawImage(bmp, 0, 0); bmp.close();
});
addEventListener('resize', fit);
addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); else window.native.toMain({ type: 'key', key: e.key, code: e.code }); });
</script></body></html>
